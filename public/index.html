<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConvoTranslater</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>ConvoTranslater</h1>
      <p class="subtitle">Real-time bilingual conversation</p>
    </header>

    <div id="setup-panel">
      <div class="setup-row">
        <div class="lang-block">
          <span class="lang-label">Speaker A</span>
          <div class="lang-fixed">English</div>
        </div>
        <div class="swap-arrow">&#8646;</div>
        <div class="lang-block">
          <span class="lang-label">Speaker B</span>
          <select id="target-lang">
            <option value="">Loading languages...</option>
          </select>
        </div>
      </div>
      <div class="vibe-row">
        <span class="lang-label">Vibe</span>
        <div id="vibe-toggle">
          <button id="vibe-standard" class="vibe-btn vibe-active">Standard</button>
          <button id="vibe-flirty" class="vibe-btn">&#128523; Flirty</button>
        </div>
      </div>
    </div>

    <div id="conversation"></div>

    <div id="controls">
      <div id="mode-toggle">
        <button id="mode-manual" class="mode-btn mode-active">
          <span class="mode-icon">&#9654;&#9646;</span> Manual
        </button>
        <button id="mode-auto" class="mode-btn">
          <span class="mode-icon">&#8635;</span> Auto
        </button>
      </div>

      <div id="status-bar">
        <span id="status-text">Select a language to begin</span>
        <div id="pulse" class="hidden"></div>
      </div>

      <!-- Manual mode -->
      <div id="manual-buttons" class="btn-panel">
        <button id="btn-a" class="speak-btn btn-english" disabled>
          <span class="btn-icon">&#127908;</span>
          <span class="btn-label">Speak in English</span>
        </button>
        <button id="btn-b" class="speak-btn btn-foreign" disabled>
          <span class="btn-icon">&#127908;</span>
          <span class="btn-label" id="btn-b-label">Speak in...</span>
        </button>
      </div>

      <!-- Auto mode -->
      <div id="auto-buttons" class="btn-panel hidden">
        <div id="auto-start">
          <p class="auto-hint">Who speaks first?</p>
          <div class="auto-start-row">
            <button id="btn-auto-a" class="speak-btn btn-english" disabled>
              <span class="btn-icon">&#9654;</span>
              <span class="btn-label">English first</span>
            </button>
            <button id="btn-auto-b" class="speak-btn btn-foreign" disabled>
              <span class="btn-icon">&#9654;</span>
              <span class="btn-label" id="btn-auto-b-label">Start with...</span>
            </button>
          </div>
        </div>
        <div id="auto-running" class="hidden">
          <div id="turn-indicator">
            <div id="turn-a" class="turn-pill turn-pill-a">Speaker A listening</div>
            <div id="turn-b" class="turn-pill turn-pill-b hidden">Speaker B listening</div>
          </div>
          <button id="btn-stop" class="stop-btn">
            <span>&#9632;</span> Stop conversation
          </button>
        </div>
      </div>

      <button id="btn-clear" class="clear-btn">Clear conversation</button>
    </div>

    <div id="browser-warning" class="hidden">
      <p>Your browser does not support the Web Speech API. Please use Chrome or Edge for voice features.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
